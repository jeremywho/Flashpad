<!DOCTYPE html>
<html lang="en" data-theme="dark" data-variant="ledger">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashpad</title>
    <script>
      // FOUC-safe appearance bootstrap. Runs before any stylesheet links below.
      (function () {
        try {
          var r = document.documentElement;
          var raw = localStorage.getItem('flashpad.appearance');
          var a = raw ? JSON.parse(raw) : {};
          var t = a.theme;
          if (t === 'system' || t == null) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          r.dataset.theme = (t === 'light') ? 'light' : 'dark';
          var v = a.variant;
          // Mirrors the v2 migration in AppearanceProvider, so a stored
          // 'paper' does not flash before React corrects it.
          if (a.v !== 2 && v === 'paper') { v = 'ledger'; }
          if (v === 'ledger' || v === 'paper' || v === 'terminal' || v === 'atelier' || v === 'index') {
            r.dataset.variant = v;
          }
          // Bounds and the v2 size floor mirror AppearanceProvider.
          var fs = a.editorFontSize;
          if (typeof fs !== 'number' || fs < 13 || fs > 32) { fs = 22; }
          if (a.v !== 2) { fs = Math.max(fs, 22); }
          r.style.setProperty('--editor-size', fs + 'px');
        } catch (e) { /* keep static fallback on <html> */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
